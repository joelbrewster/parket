# parket configuration
# copy to ~/.config/parket/config.toml

# number of workspaces (1-10, bound to 1-9 then 0)
# workspace_count = 10

# also bind q-p to workspaces 1-10 (q=1 ... p=10)
# note: takes over modifier+q..p, so option+e/u/i dead keys stop typing accents
# workspace_letter_keys = true

# focus the window under the mouse pointer when the pointer moves onto it
# focus_follows_mouse = true

# dwm-style bar over the macOS menu bar (default on)
# bar = true

# menu bar extra with workspace badges (default off)
# menu_bar_icon = false

# bar typeface: "menubar" (macOS menu bar) or "mono" (Yakshaven)
# bar_font = "mono"

# selected window title: "text" (accent-coloured text, no box), "fill", or "outline"
# bar_highlight = "text"
# workspace numbers; omit to follow bar_highlight
# bar_tag_highlight = "text"

# master window width ratio (0.0-1.0)
# master_ratio = 0.45

# global modifier key: "option", "control", "command"
# modifier = "option"
# also fire the same binds with control+option+command, and +shift for move binds
# hyper = true

# padding around the tiled area (under the bar, left, right, bottom)
# outer_gap = 0

# space between tiled windows (monocle stays full-bleed)
# window_gap = 8

# focused window outline
# border_width = 2
# border_radius = 6

# app name or bundle id for option+shift+return; omit to use the macOS default terminal
# terminal = "Ghostty"

# built-in action bindings
# key names: a-z, 0-9, return, tab, space, escape, delete,
#   comma, period, slash, backslash, minus, equal, grave,
#   leftbracket, rightbracket, semicolon, quote
# prefix with shift+ for shift modifier
# [bindings]
# focus_next = "j"
# focus_prev = "k"
# swap_master = "return"
# toggle_layout = "m"
# toggle_floating = "f"
# toggle_bar = "b"
# spawn_terminal = "shift+return"
# decrease_master = "h"
# increase_master = "l"
# focus_monitor_prev = "comma"
# focus_monitor_next = "period"
# move_monitor_prev = "shift+comma"
# move_monitor_next = "shift+period"
# last_workspace = "tab"
# reload_config = "shift+c"
# rename_workspace = "n"

# names shown on the bar as 2-main
# [workspace_names]
# 2 = "main"

# custom key bindings that run shell commands
# [[custom]]
# key = "shift+space"
# command = "open -n -a Safari"

# optional workspace/float hints (session memory usually replaces these)
# small windows and Picture in Picture float automatically
# [[rules]]
# app = "Safari"
# workspace = 2
